org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
# NOTE: Jetifier remains enabled because certain Flutter plugins (google_sign_in,
# share_plus, printing-related transitive deps) still transitively reference
# old android.support classes internally. Disabling this breaks the Android
# release build. Revisit after a full flutter pub upgrade of all plugins.
android.enableJetifier=true
android.nonTransitiveRClass=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 8.x compatibility with older plugins that don't declare namespace in build.gradle
android.defaults.buildfeatures.buildconfig=true
# Every split APK (--split-per-abi) keeps the build number from pubspec.yaml as
# its versionCode, so Settings shows "1.5.1 (2026)" rather than an ABI-offset
# number such as 2002 (arm64-v8a = 2 * 1000 + build number).
force-version-code-ignoring-abi=true

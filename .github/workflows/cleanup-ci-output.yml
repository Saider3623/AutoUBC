# Deletes ci-output/<branch> and ci-output/<branch>-android when <branch> is
# deleted (by hand, from a pull request page, or by the repository setting
# "Automatically delete head branches"), so CI results do not pile up.
# Branches deleted by auto-merge.yml are cleaned up there, because a deletion
# made with GITHUB_TOKEN does not start this workflow.
name: Cleanup CI output

on:
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.ref_type == 'branch' &&
      !startsWith(github.event.ref, 'ci-output/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete ci-output branches of the deleted branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          for ref in "ci-output/$BRANCH" "ci-output/$BRANCH-android"; do
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" >/dev/null 2>&1; then
              echo "Deleted branch $ref"
            else
              echo "No branch $ref"
            fi
          done

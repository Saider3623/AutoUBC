allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null) {
                // Old plugins (isar_flutter_libs 3) target an SDK too old for
                // current AndroidX; build every module against the app's SDK.
                try {
                    androidExt.compileSdk = 36
                } catch (Exception ignored) {}
                try {
                    if (androidExt.hasProperty("defaultConfig")) {
                        def defaultConfig = androidExt.defaultConfig
                        try {
                            defaultConfig.minSdk = 24
                        } catch (Exception ignored) {}
                    }
                } catch (Exception ignored) {}
                if (!androidExt.hasProperty("namespace") || androidExt?.namespace == null) {
                    if (project.plugins.hasPlugin("com.android.library")) {
                        def manifestFile = project.file("src/main/AndroidManifest.xml")
                        if (manifestFile.exists()) {
                            try {
                                def manifest = new XmlSlurper().parse(manifestFile)
                                def packageName = manifest.@package.text()
                                if (packageName) {
                                    androidExt.namespace = packageName
                                }
                            } catch (Exception ignored) {}
                        }
                    }
                }
            }
        }
    }
    project.configurations.configureEach { config ->
        config.resolutionStrategy {
            force 'androidx.core:core-ktx:1.15.0'
            force 'androidx.core:core:1.15.0'
            force 'androidx.appcompat:appcompat:1.7.0'
            force 'androidx.annotation:annotation:1.9.1'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
